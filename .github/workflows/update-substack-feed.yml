name: Update Substack feed

on:
  schedule:
    # Every day at 05:30 UTC — well before anyone is likely to read the site
    - cron: "30 5 * * *"
  workflow_dispatch: {}  # allows a manual refresh from the Actions tab

# Needed so the job can commit the refreshed substack.json back to the repo
permissions:
  contents: write

# If a manual run overlaps the nightly one, let the newer run win
concurrency:
  group: update-substack-feed
  cancel-in-progress: true

jobs:
  refresh-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest posts
        run: python .github/scripts/fetch_substack.py

      - name: Commit if the feed changed
        run: |
          if git diff --quiet -- substack.json; then
            echo "No new posts — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add substack.json
          git commit -m "Update Substack feed snapshot"
          git push
